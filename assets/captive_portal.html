<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>WiFi Setup</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    </head>
    <body>
        <div class="card">
            <h1>WiFi Setup</h1>
            <form id="f">
                <label for="s">SSID</label>
                <div class="ssid-row">
                    <select id="s" name="ssid" required>
                        <option value="">Scanning...</option>
                    </select>
                    <button
                        type="button"
                        id="refresh"
                        class="refresh-btn"
                        onclick="scan()"
                        title="Refresh"
                    >
                        <span class="icon">&#x21bb;</span>
                    </button>
                </div>
                <label for="p">Password</label>
                <input
                    id="p"
                    name="pass"
                    type="password"
                    minlength="8"
                    maxlength="63"
                    placeholder="Empty for open network"
                />
                <button type="submit">Connect</button>
            </form>
            <div class="msg" id="msg"></div>
        </div>
        <script>
            var sel = document.getElementById("s"),
                btn = document.getElementById("refresh");

            function scanDone() {
                btn.disabled = false;
                btn.classList.remove("spinning");
            }

            function scan() {
                btn.disabled = true;
                btn.classList.add("spinning");
                sel.innerHTML = '<option value="">Scanning...</option>';
                var x = new XMLHttpRequest();
                x.timeout = 15000;
                x.open("GET", "/scan");
                x.onload = function () {
                    scanDone();
                    if (x.status !== 200) {
                        sel.innerHTML = '<option value="">Scan failed</option>';
                        return;
                    }
                    var aps = JSON.parse(x.responseText);
                    if (!aps.length) {
                        sel.innerHTML = '<option value="">None found</option>';
                        return;
                    }
                    sel.innerHTML = "";
                    for (var i = 0; i < aps.length; i++) {
                        var o = document.createElement("option");
                        o.value = aps[i][0];
                        o.textContent = aps[i][0] + " (" + aps[i][1] + " dBm)";
                        sel.appendChild(o);
                    }
                };
                x.onerror = x.ontimeout = function () {
                    scanDone();
                    sel.innerHTML = '<option value="">Scan failed</option>';
                };
                x.send();
            }
            scan();

            function pollStatus(submitBtn, msgEl) {
                var x = new XMLHttpRequest();
                x.timeout = 5000;
                x.open("GET", "/status");
                x.onload = function () {
                    if (x.status !== 200) {
                        // Server reachable but errored — keep polling.
                        setTimeout(function () { pollStatus(submitBtn, msgEl); }, 1500);
                        return;
                    }
                    var s;
                    try { s = JSON.parse(x.responseText).state; }
                    catch (e) { s = "trying"; }
                    if (s === "connected") {
                        msgEl.className = "msg ok";
                        msgEl.textContent = "Connected — closing...";
                        // Captive WebView popups honor window.close(); regular
                        // browsers fall back to about:blank.
                        setTimeout(function () {
                            window.close();
                            window.location.href = "about:blank";
                        }, 800);
                    } else if (s === "failed") {
                        msgEl.className = "msg err";
                        msgEl.textContent = "Could not connect — check the password and try again.";
                        submitBtn.disabled = false;
                    } else {
                        // idle / trying — keep polling
                        setTimeout(function () { pollStatus(submitBtn, msgEl); }, 1000);
                    }
                };
                x.onerror = x.ontimeout = function () {
                    // AP may be momentarily unreachable; back off and retry.
                    setTimeout(function () { pollStatus(submitBtn, msgEl); }, 2000);
                };
                x.send();
            }

            document.getElementById("f").onsubmit = function (e) {
                e.preventDefault();
                var m = document.getElementById("msg");
                var p = document.getElementById("p").value;
                if (p.length > 0 && (p.length < 8 || p.length > 63)) {
                    m.className = "msg err";
                    m.textContent = "Password must be 8-63 characters";
                    return;
                }
                var b = this.querySelector("button[type=submit]");
                b.disabled = true;
                var f = new FormData(this);
                var x = new XMLHttpRequest();
                x.open("POST", "/save");
                x.setRequestHeader(
                    "Content-Type",
                    "application/x-www-form-urlencoded",
                );
                x.onload = function () {
                    var m = document.getElementById("msg");
                    if (x.status === 200) {
                        m.className = "msg progress";
                        m.textContent = "Connecting...";
                        pollStatus(b, m);
                    } else {
                        var msg;
                        try {
                            msg = JSON.parse(x.responseText).error;
                        } catch (e) {
                            msg = x.responseText;
                        }
                        m.className = "msg err";
                        m.textContent = "Error: " + msg;
                        b.disabled = false;
                    }
                };
                x.onerror = function () {
                    document.getElementById("msg").className = "msg err";
                    document.getElementById("msg").textContent =
                        "Connection failed";
                    b.disabled = false;
                };
                x.send(
                    "ssid=" +
                        encodeURIComponent(f.get("ssid")) +
                        "&pass=" +
                        encodeURIComponent(f.get("pass")),
                );
            };
        </script>
    </body>
</html>
