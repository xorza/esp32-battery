[package]
name = "esp32-battery"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "esp32-battery"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"
panic = "abort"

[workspace]
exclude = ["logic"]

[features]
default = ["esp32c6", "lcd"]
esp32c3 = []
esp32c6 = []
lcd = ["mipidsi", "embedded-graphics"]
ina-fake = []
xy-fake = []

[dependencies]
esp32-battery-logic = { path = "logic" }
xy-modbus = { git = "https://github.com/xorza/xy-modbus.git", branch = "master", features = ["esp-idf-hal"] }
log = "0.4"
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
ina228 = { git="https://github.com/xorza/ina228.git", branch = "master" }
embedded-hal = "1.0"
heapless = "0.9"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
strum = { version = "0.28", default-features = false, features = ["derive"] }
mipidsi = { version = "0.10", optional = true }
embedded-graphics = { version = "0.8", optional = true }

[build-dependencies]
embuild = "0.33"
flate2 = "1.1"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "*" }
