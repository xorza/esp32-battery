[build]
# Default target is esp32c6. Use `cargo c3` or `cargo c6` for explicit chip selection.
target = "riscv32imac-esp-espidf"

[alias]
c6 = "build --release --target riscv32imac-esp-espidf"
c3 = "build --release --target riscv32imc-esp-espidf --no-default-features --features esp32c3"
check-c6 = "check --target riscv32imac-esp-espidf"
check-c3 = "check --target riscv32imc-esp-espidf --no-default-features --features esp32c3"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
rustflags = [
    "--cfg", "espidf_time64",
    "-Zunstable-options", "-Cpanic=immediate-abort",
]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
rustflags = [
    "--cfg", "espidf_time64",
    "-Zunstable-options", "-Cpanic=immediate-abort",
]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Override with: MCU=esp32c3 cargo build --release
MCU = { value = "esp32c6", relative = false }
# Pinned to the tag, not `release/v5.5`: v5.5.5 added
# `unaligned_multi_block_rw_max_chunk_size` to `sdmmc_host_t`, and published
# esp-idf-hal 0.46.2 does not initialize it, so its `sdmmc` module stops
# compiling. Move to the branch once esp-idf-hal publishes past 0.46.2.
ESP_IDF_VERSION = "v5.5.4"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
