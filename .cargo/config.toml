[build]
# Default target is esp32c6. For esp32c3: MCU=esp32c3 cargo build --target riscv32imc-esp-espidf
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Override with: MCU=esp32c3 cargo build --release
MCU = { value = "esp32c6", relative = false }
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
LIBCLANG_PATH = { value = "/usr/lib/llvm19/lib/", force = true }
