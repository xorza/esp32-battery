[package]
name = "xy-modbus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Modbus-RTU driver for the XY-series programmable buck converters (XY7025, XY6020L, XY6015, XY-SK60/120/120X)."
keywords = ["xy7025", "xy6020", "modbus", "buck", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"
repository = "https://github.com/xxorza/xy-modbus"
documentation = "https://docs.rs/xy-modbus"

[features]
default = []
defmt = ["dep:defmt"]
serde = ["dep:serde"]

[dependencies]
defmt = { version = "1.0", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
